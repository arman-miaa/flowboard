version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: flowboard_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: flowboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Uncomment to run backend via docker
  # backend:
  #   build:
  #     context: ./backend
  #   container_name: flowboard_backend
  #   ports:
  #     - "5000:5000"
  #   environment:
  #     - DATABASE_URL=postgresql://postgres:password@postgres:5432/flowboard?schema=public
  #     - JWT_SECRET=your_jwt_secret_key_here
  #     - PORT=5000
  #   depends_on:
  #     - postgres

  # Uncomment to run frontend via docker
  # frontend:
  #   build:
  #     context: ./frontend
  #   container_name: flowboard_frontend
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - NEXT_PUBLIC_API_URL=http://localhost:5000/api/v1
  #   depends_on:
  #     - backend

volumes:
  postgres_data:
